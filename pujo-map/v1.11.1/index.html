<style>
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;
	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;
	text-indent: 1px;
	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}


/* layers control */

.leaflet-control-layers {
	box-shadow: 0 1px 5px rgba(0,0,0,0.4);
	background: #fff;
	border-radius: 5px;
	}
.leaflet-control-layers-toggle {
	width: 36px;
	height: 36px;
	}
.leaflet-retina .leaflet-control-layers-toggle {
	background-size: 26px 26px;
	}
.leaflet-touch .leaflet-control-layers-toggle {
	width: 44px;
	height: 44px;
	}
.leaflet-control-layers .leaflet-control-layers-list,
.leaflet-control-layers-expanded .leaflet-control-layers-toggle {
	display: none;
	}
.leaflet-control-layers-expanded .leaflet-control-layers-list {
	display: block;
	position: relative;
	}
.leaflet-control-layers-expanded {
	padding: 6px 10px 6px 6px;
	color: #333;
	background: #fff;
	}
.leaflet-control-layers-scrollbar {
	overflow-y: scroll;
	overflow-x: hidden;
	padding-right: 5px;
	}
.leaflet-control-layers-selector {
	margin-top: 2px;
	position: relative;
	top: 1px;
	}
.leaflet-control-layers label {
	display: block;
	font-size: 13px;
	font-size: 1.08333em;
	}
.leaflet-control-layers-separator {
	height: 0;
	border-top: 1px solid #ddd;
	margin: 5px -10px 5px -6px;
	}

/* Default icon URLs */
.leaflet-default-icon-path { /* used only in path-guessing heuristic, see L.Icon.Default */
	}


/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);
	margin: 0;
	}
.leaflet-control-attribution,
.leaflet-control-scale-line {
	padding: 0 5px;
	color: #333;
	line-height: 1.4;
	}
.leaflet-control-attribution a {
	text-decoration: none;
	}
.leaflet-control-attribution a:hover,
.leaflet-control-attribution a:focus {
	text-decoration: underline;
	}
.leaflet-attribution-flag {
	display: inline !important;
	vertical-align: baseline !important;
	width: 1em;
	height: 0.6669em;
	}
.leaflet-left .leaflet-control-scale {
	margin-left: 5px;
	}
.leaflet-bottom .leaflet-control-scale {
	margin-bottom: 5px;
	}
.leaflet-control-scale-line {
	border: 2px solid #777;
	border-top: none;
	line-height: 1.1;
	padding: 2px 5px 1px;
	white-space: nowrap;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	background: rgba(255, 255, 255, 0.8);
	text-shadow: 1px 1px #fff;
	}
.leaflet-control-scale-line:not(:first-child) {
	border-top: 2px solid #777;
	border-bottom: none;
	margin-top: -2px;
	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {
	border-bottom: 2px solid #777;
	}

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	box-shadow: none;
	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	border: 2px solid rgba(0,0,0,0.2);
	background-clip: padding-box;
	}


/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;
	text-align: left;
	border-radius: 12px;
	}
.leaflet-popup-content {
	margin: 13px 24px 13px 20px;
	line-height: 1.3;
	font-size: 13px;
	font-size: 1.08333em;
	min-height: 1px;
	}
.leaflet-popup-content p {
	margin: 17px 0;
	margin: 1.3em 0;
	}
.leaflet-popup-tip-container {
	width: 40px;
	height: 20px;
	position: absolute;
	left: 50%;
	margin-top: -1px;
	margin-left: -20px;
	overflow: hidden;
	pointer-events: none;
	}
.leaflet-popup-tip {
	width: 17px;
	height: 17px;
	padding: 1px;

	margin: -10px auto 0;
	pointer-events: auto;

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);
	        transform: rotate(45deg);
	}
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
	background: white;
	color: #333;
	box-shadow: 0 3px 14px rgba(0,0,0,0.4);
	}
.leaflet-container a.leaflet-popup-close-button {

      var c = map.latLngToContainerPoint([p.y, p.x]), mb = $("map").getBoundingClientRect();
      if (c.x < 24 || c.y < headH() + 24 || c.x > mb.width - 24 || c.y > mb.height - sheetH() - 24) return null;
      return { x: mb.left + c.x - 26, y: mb.top + c.y - 26, w: 52, h: 52, r: 26 };
    }
    if (key === "sheet") { var s0 = $("sheet").getBoundingClientRect(); return { x: s0.left + 6, y: s0.top + 4, w: s0.width - 12, h: Math.min(s0.height - 8, 190), r: 16 }; }
    if (key === "search") return unionOf([$("q").parentElement, $("area")], 6);
    if (key === "prefs") return unionOf([$("langBtn"), $("themeBtn")], 6);
    var el = document.querySelector(key); return el ? rectOf(el, 6) : null;
  }
  function placeTour(tg) {
    var hole = $("tourHole"), card = $("tourCard"), vw = window.innerWidth, vh = window.innerHeight;
    if (tg) { hole.className = "tour-hole"; hole.style.cssText = "left:" + tg.x + "px;top:" + tg.y + "px;width:" + tg.w + "px;height:" + tg.h + "px;border-radius:" + tg.r + "px"; }
    else { hole.className = "tour-hole none"; hole.style.cssText = "left:" + vw / 2 + "px;top:" + vh / 2 + "px;width:0;height:0;border-radius:0"; }
    var cw = Math.min(344, vw - 24); card.style.width = cw + "px";
    var ch = card.offsetHeight, x, y;
    if (!tg) { x = (vw - cw) / 2; y = (vh - ch) / 2; }
    else {
      x = Math.max(12, Math.min(vw - cw - 12, tg.x + tg.w / 2 - cw / 2));
      if (tg.y + tg.h + 14 + ch <= vh - 12) y = tg.y + tg.h + 14;
      else if (tg.y - 14 - ch >= 12) y = tg.y - 14 - ch;
      else y = Math.max(12, vh - ch - 12);
    }
    card.style.left = x + "px"; card.style.top = y + "px";
  }
  function showStep(i) {
    var steps = t("tourSteps"), n = steps.length; tour.i = i;
    $("tourStep").textContent = t("tourOf", i + 1, n);
    $("tourDots").innerHTML = steps.map(function (_, k) { return '<i class="' + (k < i ? "is-done" : k === i ? "is-now" : "") + '"></i>'; }).join("");
    $("tourTitle").textContent = steps[i][0]; $("tourText").textContent = steps[i][1];
    tour.sub = -1; $("tourSub").hidden = true;
    $("tourMore").textContent = t("tourMore"); $("tourMore").hidden = i !== TOUR_BTN_STEP;
    $("tourBack").textContent = t("tourBack"); $("tourBack").hidden = i === 0;
    $("tourSkip").textContent = t("tourSkip"); $("tourSkip").hidden = i === n - 1;
    $("tourNext").textContent = i === n - 1 ? t("tourDone") : t("tourNext");
    placeTour(tourTarget(TOUR_AT[i]));
    paintTourSound();
    $("tourNext").focus({ preventScroll: true });
  }
  function showSub(k) {
    var list = t("tourButtons"), n = list.length; tour.sub = k;
    $("tourSub").hidden = false; $("tourSub").textContent = t("tourSubOf", k + 1, n);
    $("tourTitle").textContent = list[k][0]; $("tourText").textContent = list[k][1];
    $("tourMore").hidden = true; $("tourBack").hidden = false; $("tourSkip").hidden = false;
    $("tourBack").textContent = t("tourBack"); $("tourSkip").textContent = t("tourSkip"); $("tourNext").textContent = t("tourNext");
    placeTour(tourTarget(TOUR_BTN_AT[k]));
    paintTourSound();
    $("tourNext").focus({ preventScroll: true });
  }
  function refreshTour() { if (tour.sub >= 0) showSub(tour.sub); else showStep(tour.i); }
  $("tourMore").addEventListener("click", function () { showSub(0); });
  function paintTourSound() { var b = $("tourSound"); b.innerHTML = soundOn ? ICON.sound : ICON.mute; b.setAttribute("aria-pressed", String(soundOn)); b.setAttribute("aria-label", soundOn ? t("soundOff") : t("soundOn")); b.title = b.getAttribute("aria-label"); }
  $("tourSound").addEventListener("click", function () { toggleSound(); paintTourSound(); });
  function startTour() {
    if (tour.on) return;
    if (dlg.open) { dlg.close ? dlg.close() : dlg.removeAttribute("open"); }
    tour.on = true; tour.back = document.activeElement; $("tour").hidden = false;
    tour.inert = [].filter.call(document.body.children, function (el) { return el.id !== "tour" && !/^(SCRIPT|AUDIO|STYLE)$/.test(el.tagName) && !el.inert; });
    tour.inert.forEach(function (el) { el.inert = true; });
    var wait = 0; if (sheetAt === "full") { setSheet("half"); wait = 320; }
    $("tourCard").style.visibility = "hidden";
    setTimeout(function () { $("tourCard").style.visibility = ""; if (tour.on) showStep(0); }, wait);
  }
  function endTour() {
    if (!tour.on) return;
    tour.on = false; $("tour").hidden = true;
    (tour.inert || []).forEach(function (el) { el.inert = false; }); tour.inert = null;
    try { localStorage.setItem("pujo-tour", "done"); } catch (e) {}
    if (tour.back && tour.back.focus) { try { tour.back.focus({ preventScroll: true }); } catch (e) {} }
  }
  function tourGo(d) {
    if (tour.sub >= 0) { var k = tour.sub + d; if (k < 0) showStep(tour.i); else if (k >= t("tourButtons").length) showStep(tour.i + 1); else showSub(k); return; }
    var n = t("tourSteps").length, j = tour.i + d; if (j >= n) { endTour(); return; } if (j >= 0) showStep(j); }
  $("tourNext").addEventListener("click", function () { tourGo(1); });
  $("tourBack").addEventListener("click", function () { tourGo(-1); });
  $("tourSkip").addEventListener("click", endTour);
  window.addEventListener("keydown", function (e) {
    if (!tour.on) return;
    if (e.key === "Escape") { e.preventDefault(); endTour(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); tourGo(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); tourGo(-1); }
    else if (e.key === "Tab") {
      var bs = [$("tourSound"), $("tourMore"), $("tourSkip"), $("tourBack"), $("tourNext")].filter(function (b) { return !b.hidden; }), at = bs.indexOf(document.activeElement);
      e.preventDefault(); bs[(at + (e.shiftKey ? bs.length - 1 : 1)) % bs.length].focus();
    }
  }, true);
  window.addEventListener("resize", function () { if (tour.on) refreshTour(); });
  window.pujoTour = startTour;
  try { if (localStorage.getItem("pujo-tour") !== "done") setTimeout(function () { if (!tour.on && !dlg.open && !state.picking) startTour(); }, 2400); } catch (e) {}

  /* ---------- start: open around IIT Bombay with the nearest pujos in view ---------- */
  state.me = { lat: HOME.lat, lng: HOME.lng, acc: 0, source: "home" };
  applyLang();
  layout();
  var start = L.latLngBounds([[HOME.lat, HOME.lng]]);
  shown.slice(0, 8).forEach(function (p) { start.extend([p.y, p.x]); });
  map.fitBounds(start, { paddingTopLeft: [28, headH() + 28], paddingBottomRight: [28, sheetH() + 28], maxZoom: 14 });
  syncPlaces();
  var rt;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(layout, 120); });
  var zoomCtl = map.zoomControl || null;
  function onBreakpoint() {
    if (phone.matches) { if (zoomCtl) zoomCtl.remove(); map.attributionControl.setPosition("topright"); }
    else { if (!zoomCtl) zoomCtl = L.control.zoom(); zoomCtl.addTo(map); map.attributionControl.setPosition("bottomright"); }
    markers.forEach(function (m, i) {
      if (phone.matches) m.unbindTooltip();
      else if (!m.getTooltip()) m.bindTooltip(esc(PUJAS[i].name), { direction: "top", offset: [0, -6], className: "name-tip" });
    });
    layout(); layoutLabels();
  }
  try { phone.addEventListener("change", onBreakpoint); } catch (e) { try { phone.addListener(onBreakpoint); } catch (e2) {} }
  if (document.readyState === "complete") setTimeout(startDeck, 600);
  else window.addEventListener("load", function () { setTimeout(startDeck, 600); });
})();
</script>
