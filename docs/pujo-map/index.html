<title>Mumbai Durga Pujo Map</title>

<style>
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;
	background-repeat: no-repeat;
	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;
	border-top-right-radius: 4px;
	}
.leaflet-bar a:last-child {
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {
	cursor: default;
	background-color: #f4f4f4;
	color: #bbb;
	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;
	line-height: 30px;
	}
.leaflet-touch .leaflet-bar a:first-child {
	border-top-left-radius: 2px;
	border-top-right-radius: 2px;
	}
.leaflet-touch .leaflet-bar a:last-child {
	border-bottom-left-radius: 2px;
	border-bottom-right-radius: 2px;
	}

/* zoom control */

.leaflet-control-zoom-in,
.leaflet-control-zoom-out {
	font: bold 18px 'Lucida Console', Monaco, monospace;
	text-indent: 1px;
	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {
	font-size: 22px;
	}


/* layers control */

.leaflet-control-layers {
	box-shadow: 0 1px 5px rgba(0,0,0,0.4);
	background: #fff;
	border-radius: 5px;
	}
.leaflet-control-layers-toggle {
	width: 36px;
	height: 36px;
	}
.leaflet-retina .leaflet-control-layers-toggle {
	background-size: 26px 26px;
	}
.leaflet-touch .leaflet-control-layers-toggle {
	width: 44px;
	height: 44px;
	}
.leaflet-control-layers .leaflet-control-layers-list,
.leaflet-control-layers-expanded .leaflet-control-layers-toggle {
	display: none;
	}
.leaflet-control-layers-expanded .leaflet-control-layers-list {
	display: block;
	position: relative;
	}
.leaflet-control-layers-expanded {
	padding: 6px 10px 6px 6px;
	color: #333;
	background: #fff;
	}
.leaflet-control-layers-scrollbar {
	overflow-y: scroll;
	overflow-x: hidden;
	padding-right: 5px;
	}
.leaflet-control-layers-selector {
	margin-top: 2px;
	position: relative;
	top: 1px;
	}
.leaflet-control-layers label {
	display: block;
	font-size: 13px;
	font-size: 1.08333em;
	}
.leaflet-control-layers-separator {
	height: 0;
	border-top: 1px solid #ddd;
	margin: 5px -10px 5px -6px;
	}

/* Default icon URLs */
.leaflet-default-icon-path { /* used only in path-guessing heuristic, see L.Icon.Default */
	}


/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {
	background: #fff;
	background: rgba(255, 255, 255, 0.8);
	margin: 0;
	}
.leaflet-control-attribution,
.leaflet-control-scale-line {
	padding: 0 5px;
	color: #333;
	line-height: 1.4;
	}
.leaflet-control-attribution a {
	text-decoration: none;
	}
.leaflet-control-attribution a:hover,
.leaflet-control-attribution a:focus {
	text-decoration: underline;
	}
.leaflet-attribution-flag {
	display: inline !important;
	vertical-align: baseline !important;
	width: 1em;
	height: 0.6669em;
	}
.leaflet-left .leaflet-control-scale {
	margin-left: 5px;
	}
.leaflet-bottom .leaflet-control-scale {
	margin-bottom: 5px;
	}
.leaflet-control-scale-line {
	border: 2px solid #777;
	border-top: none;
	line-height: 1.1;
	padding: 2px 5px 1px;
	white-space: nowrap;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	background: rgba(255, 255, 255, 0.8);
	text-shadow: 1px 1px #fff;
	}
.leaflet-control-scale-line:not(:first-child) {
	border-top: 2px solid #777;
	border-bottom: none;
	margin-top: -2px;
	}
.leaflet-control-scale-line:not(:first-child):not(:last-child) {
	border-bottom: 2px solid #777;
	}

.leaflet-touch .leaflet-control-attribution,
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	box-shadow: none;
	}
.leaflet-touch .leaflet-control-layers,
.leaflet-touch .leaflet-bar {
	border: 2px solid rgba(0,0,0,0.2);
	background-clip: padding-box;
	}


/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {
	padding: 1px;
	text-align: left;
	border-radius: 12px;
	}
.leaflet-popup-content {
	margin: 13px 24px 13px 20px;
	line-height: 1.3;
	font-size: 13px;
	font-size: 1.08333em;
	min-height: 1px;
	}
.leaflet-popup-content p {
	margin: 17px 0;
	margin: 1.3em 0;
	}
.leaflet-popup-tip-container {
	width: 40px;
	height: 20px;
	position: absolute;
	left: 50%;
	margin-top: -1px;
	margin-left: -20px;
	overflow: hidden;
	pointer-events: none;
	}
.leaflet-popup-tip {
	width: 17px;
	height: 17px;
	padding: 1px;

	margin: -10px auto 0;
	pointer-events: auto;

	-webkit-transform: rotate(45deg);
	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);
	        transform: rotate(45deg);
	}
.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
	background: white;
	color: #333;
	box-shadow: 0 3px 14px rgba(0,0,0,0.4);
	}
.leaflet-container a.leaflet-popup-close-button {
	position: absolute;
	top: 0;
	right: 0;
	border: none;
	text-align: center;
	width: 24px;
	height: 24px;
	font: 16px/24px Tahoma, Verdana, sans-serif;
	color: #757575;
	text-decoration: none;

.about ul { padding-left: 18px; display: grid; gap: 4px; }

.close { justify-self: end; border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 7px 16px; cursor: pointer; font-weight: 600; }

.toast {
  position: fixed; z-index: 1000; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--paper); padding: 9px 14px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px);
}
.toast b { user-select: all; font-weight: 600; }

      btnBox.addEventListener("click", function (e) {
        var a = e.target.closest("a"); if (!a) return;
        e.preventDefault();
        if (a.hasAttribute("data-home")) goHome();
        else if (a.hasAttribute("data-all")) showAll();
        else setRoute(!state.route);
      });
      return btnBox;
    }
  });
  new Buttons().addTo(map);
  function paintButtons() {
    btnBox.innerHTML = '<a href="#" role="button" data-home title="' + t("btnHome") + '" aria-label="' + t("btnHome") + '">' + ICON.house + "</a>" +
      '<a href="#" role="button" data-all title="' + t("btnAll") + '" aria-label="' + t("btnAll") + '">' + ICON.expand + "</a>" +
      '<a href="#" role="button" data-route aria-pressed="' + state.route + '" title="' + t("btnRoute") + '" aria-label="' + t("btnRoute") + '">' + ICON.route + "</a>";
  }

  /* ---------- language ---------- */
  function paintDay() {
    var now = Date.now(), d0 = Math.floor((now + IST) / DAY) * DAY - IST, d1 = d0 + DAY, cur = tithiAt(now);
    var el = $("today"), bnDate = bDate(now);
    var dateTxt = wd(now) + " " + dmy(now);
    if (LANG === "bn") el.innerHTML = (cur ? tName(cur.n) + ", " : "") + dateTxt + (bnDate ? ", " + bnDate : "");
    else el.innerHTML = (cur ? '<span lang="bn">' + tName(cur.n, "bn") + "</span>" : "") + dateTxt + (bnDate ? ', <span lang="bn" class="bd">' + bnDate + "</span>" : "");
    var dayBtn = $("day");
    if (!cur) { dayBtn.hidden = true; return; }
    dayBtn.hidden = false;
    var o = state.me || HOME, sun = sunTimes(d0, o.lat, o.lng);
    function x(ms) { return Math.max(0, Math.min(100, (ms - d0) / DAY * 100)); }
    /* segments of the day by tithi */
    var segs = [], t0 = d0, k = tithiAt(d0);
    while (k && t0 < d1) { segs.push([t0, Math.min(k.end, d1), k.n]); t0 = k.end; k = tithiAt(t0); }
    var bar = "";
    segs.forEach(function (g) { bar += '<i class="seg' + (g[2] === cur.n ? " cur" : "") + '" style="left:' + x(g[0]) + "%;width:" + (x(g[1]) - x(g[0])) + '%"></i>'; });
    bar += '<i class="night" style="left:0;width:' + x(sun[0]) + '%"></i><i class="night" style="left:' + x(sun[1]) + "%;right:0" + '"></i>';
    [6, 12, 18].forEach(function (h) { bar += '<i class="tick" style="left:' + (h / 24 * 100) + '%"></i>'; });
    segs.slice(1).forEach(function (g) { bar += '<i class="cut" style="left:' + x(g[0]) + '%"></i>'; });
    $("dayBar").innerHTML = bar;
    $("dayNow").style.left = x(now) + "%";
    /* labels, most important first; any that would collide are left out */
    var labs = [{ cls: "now", txt: hhmm(now), at: x(now), al: "c", p: 0 }];
    segs.slice(1).forEach(function (g) { labs.push({ cls: g[2] === cur.n ? "cur" : "", txt: tName(g[2]) + " " + hhmm(g[0]), at: x(g[0]), al: "se", p: 1 }); });
    if (cur.end > d1) { var nx = tithiAt(cur.end); if (nx) labs.push({ cls: "", txt: t("nextAt", tName(nx.n), wd(cur.end) + " " + hhmm(cur.end)), at: 100, al: "e", p: 2 }); }
    labs.push({ cls: segs[0][2] === cur.n ? "cur" : "", txt: tName(segs[0][2]), at: 0, al: "s", p: 3 });
    labs.push({ cls: "", txt: "☀︎ " + hhmm(sun[0]), at: x(sun[0]), al: "c", p: 4 });
    labs.push({ cls: "", txt: "☾ " + hhmm(sun[1]), at: x(sun[1]), al: "c", p: 4 });
    var box = $("dayLabs");
    box.innerHTML = labs.map(function (l, i) { return '<span class="day-lab ' + l.cls + '" data-i="' + i + '">' + esc(l.txt) + "</span>"; }).join("");
    var W = box.clientWidth, els = [].slice.call(box.children), widths = els.map(function (e) { return e.offsetWidth; });
    function place(nowAl) {
      var kept = [], pos = [], score = 0;
      labs.map(function (l, i) { return i; }).sort(function (a, b) { return labs[a].p - labs[b].p; }).forEach(function (i) {
        var l = labs[i], w = widths[i], px = l.at / 100 * W, spot = null;
        (i === 0 ? nowAl : l.al).split("").some(function (a) {
          var left = a === "c" ? px - w / 2 : a === "e" ? px - w - (l.at < 100 ? 4 : 0) : px + 4;
          if (a === "s" && left + w > W) return false;
          left = Math.max(0, Math.min(W - w, left));
          if (kept.some(function (k2) { return left < k2[1] + 6 && left + w + 6 > k2[0]; })) return false;
          spot = left; return true;
        });
        pos[i] = spot;
        if (spot !== null) { kept.push([spot, spot + w]); score += Math.pow(10, 5 - l.p); }
      });
      return { pos: pos, score: score };
    }
    var best = ["c", "e", "s"].map(place).reduce(function (a, b) { return b.score > a.score ? b : a; });
    els.forEach(function (e, i) { if (best.pos[i] === null) e.classList.add("off"); else e.style.left = best.pos[i] + "px"; });
    var aria = tName(cur.n) + " " + t("since") + " " + wd(cur.start) + " " + hhmm(cur.start) + ". ";
    var nx2 = tithiAt(cur.end); if (nx2) aria += tName(nx2.n) + " " + t("begins") + " " + wd(cur.end) + " " + hhmm(cur.end) + ". ";
    aria += t("sunrise") + " " + hhmm(sun[0]) + ", " + t("sunset") + " " + hhmm(sun[1]) + ". " + t("openTimes");
    dayBtn.setAttribute("aria-label", aria); dayBtn.title = aria;
  }
  function pujaRows() {
    var now = Date.now(), from = Date.UTC(2026, 9, 12), to = Date.UTC(2026, 9, 24), rows = "", sandhi = "";
    TITHI.forEach(function (e, i) {
      if (e[0] < from || e[0] > to || e[1] < 6 || e[1] > 10 || !TITHI[i + 1]) return;
      var end = TITHI[i + 1][0], live = now >= e[0] && now < end, c = live ? ' class="is-now"' : "";
      rows += '<dt lang="bn"' + c + ">" + tName(e[1], "bn") + "</dt><dd" + c + ">" + t("range", wd(e[0]) + " " + dmy(e[0]) + ", " + hhmm(e[0]), wd(end) + " " + dmy(end) + ", " + hhmm(end)) +
        (live ? ", " + t("daysToday") : "") + "<span>" + RITE[e[1]][LANG === "bn" ? 1 : 0] + "</span></dd>";
      if (e[1] === 8) sandhi = t("sandhi", wd(end) + " " + dmy(end), hhmm(end - 24 * 6e4), hhmm(end + 24 * 6e4));
    });
    return '<dl class="days">' + rows + "</dl>" + (sandhi ? "<p>" + sandhi + "</p>" : "");
  }
  function paintAbout() {
    var x = PUJAS.length - listed.length;
    $("aboutBody").innerHTML =
      '<h2 id="aboutTitle"><span aria-hidden="true">' + ALPONA + "</span>" + t("aboutTitle") + "</h2>" +
      '<h3 id="daysTitle">' + t("daysTitle") + "</h3>" + pujaRows() +
      '<p class="muted">' + t("daysSrc") + "</p>" +
      "<p>" + t("counts", entries, listed.length, cnt.exact, cnt.venue, cnt.area) + "</p>" +
      "<h3>" + t("howTitle") + "</h3><ul><li>" + t("howExact") + "</li><li>" + t("howVenue") + "</li><li>" + t("howArea") + "</li></ul>" +
      "<p>" + t("notes", x) + "</p><p>" + t("layers") + "</p>" +
      "<h3>" + t("srcTitle") + "</h3><p>" + t("src") + "</p><p>" + t("dl") + "</p>" +
      "<h3>" + t("sayTitle") + "</h3><p>" + t("say") + "</p>" +
      '<p class="muted">' + t("credit") + ' <a href="' + SITE + '" target="_blank" rel="noopener">' + t("creditName") + "</a>, " + t("iitb") + ". " + t("version") + "</p>" +
      '<button class="close" type="button" id="aboutClose">' + t("close") + "</button>";
  }
  function applyLang() {
    document.documentElement.lang = LANG;
    $("title").textContent = t("title");
    var lb = $("langBtn"); lb.textContent = t("langBtn"); lb.setAttribute("aria-label", t("langAria")); lb.title = t("langAria");
    lb.setAttribute("lang", LANG === "bn" ? "en" : "bn"); lb.classList.toggle("lang-bn", LANG === "en");
    paintThemeBtn(); paintDay();
    $("q").placeholder = t("searchPh"); $("q").setAttribute("aria-label", t("searchAria"));
    var opts = '<option value="all">' + t("allAreas") + "</option>";
    AREAS.forEach(function (a) {
      var n = PUJAS.filter(function (p) { return p.region === a; }).length;
      if (n) opts += '<option value="' + esc(a) + '"' + (state.area === a ? " selected" : "") + ">" + esc(areaName(a)) + " (" + num(n) + ")</option>";
    });
    $("area").innerHTML = opts; $("area").setAttribute("aria-label", t("areaAria"));
    $("nearBtn").setAttribute("aria-label", t("near")); $("nearBtn").title = t("near");
    $("grab").setAttribute("aria-label", sheetAt === "full" ? t("grabMap") : t("grabMore"));
    $("sheet").setAttribute("aria-label", t("title")); $("map").setAttribute("aria-label", t("title"));
    $("foot").innerHTML = '<p><button type="button" id="aboutBtn">' + t("footAbout") + "</button>" + t("footRest") + "</p>" +
      '<p class="credit">' + t("credit") + ' <a href="' + SITE + '" target="_blank" rel="noopener">' + t("creditName") + "</a>, " + t("iitb") + "</p>";
    map.attributionControl.setPrefix(t("credit") + ' <a href="' + SITE + '" target="_blank" rel="noopener">' + t("creditName") + "</a>, " + t("iitb"));
    homeMarker.setTooltipContent(t("iitb"));
    paintButtons(); paintAbout();
    render();
    if (state.open !== null && phone.matches) scrollToRow(state.open);
    if (state.picking) setPicking(true); else if (state.me && state.me.source === "picked") notice(t("picked"));
  }
  $("langBtn").addEventListener("click", function () {
    LANG = LANG === "bn" ? "en" : "bn";
    try { localStorage.setItem("pujo-lang", LANG); } catch (e) {}
    applyLang();
  });

  /* ---------- events ---------- */
  $("nearBtn").addEventListener("click", nearToggle);
  $("listHead").addEventListener("click", function (e) { if (e.target.closest("[data-locate]")) locate(); });
  $("notice").addEventListener("click", function (e) {
    if (e.target.closest("[data-cancel]")) { setPicking(false); notice(""); }
    if (e.target.closest("[data-pick]")) setPicking(true);
  });
  $("routeNote").addEventListener("click", function (e) { if (e.target.closest("[data-hide-route]")) setRoute(false); });
  $("q").addEventListener("input", function (e) { state.q = e.target.value; render(); $("listWrap").scrollTop = 0; });
  $("q").addEventListener("focus", function () { if (sheetAt !== "full") setSheet("full"); });
  $("q").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.target.blur(); setSheet("half"); fitShown(); } });
  $("area").addEventListener("change", function (e) { state.area = e.target.value; closeRow(); render(); $("listWrap").scrollTop = 0; fitShown(); });
  $("rows").addEventListener("click", function (e) {
    var row = e.target.closest(".row"); if (!row) return;
    var i = +row.getAttribute("data-i");
    if (e.target.closest("[data-copy]")) {
      var p = PUJAS[i], txt = p.lat.toFixed(6) + ", " + p.lng.toFixed(6);
      var fail = function () { toast(t("copyFail") + " <b>" + txt + "</b>", 6000); };
      try { navigator.clipboard.writeText(txt).then(function () { toast(t("copied") + " " + txt); }, fail); } catch (err) { fail(); }
      return;
    }
    if (e.target.closest(".row-btn")) openRow(i);
  });
  var dlg = $("about");
  function openAbout(toDays) {
    paintAbout();
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
    var top = toDays ? $("daysTitle") : $("aboutTitle"); if (top) top.scrollIntoView({ block: "start" });
  }
  $("foot").addEventListener("click", function (e) { if (e.target.closest("#aboutBtn")) openAbout(false); });
  $("day").addEventListener("click", function () { openAbout(true); });
  setInterval(paintDay, 30000);
  try { document.fonts.ready.then(paintDay); } catch (e) {}
  dlg.addEventListener("click", function (e) { if (e.target === dlg || e.target.closest("#aboutClose")) { dlg.close ? dlg.close() : dlg.removeAttribute("open"); } });

  function fitShown() {
    var pts = shown.filter(function (p) { return state.area === "Palghar" || p.region !== "Palghar" || shown.length === 1; }).map(function (p) { return [p.y, p.x]; });
    if (state.me && state.me.source !== "home") pts.push([state.me.lat, state.me.lng]);
    if (!pts.length) return;
    if (pts.length === 1) showPoint(pts[0], 15); else showBounds(L.latLngBounds(pts));
  }

  /* ---------- start: open around IIT Bombay with the nearest pujos in view ---------- */
  state.me = { lat: HOME.lat, lng: HOME.lng, acc: 0, source: "home" };
  applyLang();
  layout();
  var start = L.latLngBounds([[HOME.lat, HOME.lng]]);
  shown.slice(0, 8).forEach(function (p) { start.extend([p.y, p.x]); });
  map.fitBounds(start, { paddingTopLeft: [28, headH() + 28], paddingBottomRight: [28, sheetH() + 28], maxZoom: 14 });
  syncPlaces();
  var rt;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(layout, 120); });
  try { phone.addEventListener("change", function () { location.reload(); }); } catch (e) {}
  if (document.readyState === "complete") setTimeout(startDeck, 600);
  else window.addEventListener("load", function () { setTimeout(startDeck, 600); });
})();
</script>

</body>
